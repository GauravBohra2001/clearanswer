version: '3.8'

services:
  clearanswer:
    build: .
    container_name: clearanswer_app
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./outputs:/app/outputs
      # Mapping the challenge repo allows you to use the data you've already downloaded locally
      - ./oncosys-hackathon-challenge:/app/oncosys-hackathon-challenge
    restart: unless-stopped
